<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Đăng Nhập - Guitar By Quang</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">

  <!-- Google Font: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Custom Theme (script thường) -->
  <script src="assets/theme-config.js"></script>
  <!-- Custom CSS dùng chung -->
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body class="admin-page bg-[#1F1914] text-canvas min-h-screen flex flex-col justify-between selection:bg-terracotta selection:text-white">

  <!-- Top Header nhỏ gọn -->
  <header class="py-6 px-6 sm:px-12 flex items-center justify-between border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-terracotta/80 shadow-sm flex-shrink-0 bg-stone-300">
        <img src="assets/avatar.jpg" alt="Guitar By Quang" class="w-full h-full object-cover object-center" />
      </div>
      <div>
        <span class="text-lg font-extrabold text-white tracking-tight block leading-tight">Guitar By Quang</span>
        <span class="text-[11px] font-semibold text-canvas/60">Hệ Thống Quản Trị Nội Bộ</span>
      </div>
    </div>
    <a href="index.html" class="text-xs font-bold text-canvas/60 hover:text-white transition-colors flex items-center gap-1">
      <span>← Về trang chủ</span>
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-[#2D231C] border border-white/10 rounded-3xl p-6 sm:p-8 shadow-float space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-terracotta/20 border border-terracotta/30 text-terracotta flex items-center justify-center text-2xl shadow-inner">
          🔐
        </div>
        <h1 class="text-2xl font-extrabold text-white">Đăng Nhập Quản Trị</h1>
        <p class="text-xs text-canvas/60 font-medium">Khu vực riêng dành cho Quản trị viên Guitar By Quang</p>
      </div>

      <!-- Error Alert Box -->
      <div id="login-error" class="hidden p-3.5 rounded-2xl bg-rose-950/60 border border-rose-500/40 text-rose-300 text-xs font-semibold leading-relaxed flex items-center gap-2.5">
        <svg class="w-4 h-4 flex-shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="login-error-text">Lỗi đăng nhập</span>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-4" novalidate>
        <div class="space-y-1.5">
          <label for="admin-email" class="text-xs font-bold text-canvas/80 block">Email Quản Trị</label>
          <input
            type="email"
            id="admin-email"
            required
            placeholder="admin@guitarbyquang.com"
            class="w-full px-4 py-3 rounded-2xl bg-black/30 border border-white/15 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-terracotta transition-colors"
          />
        </div>

        <div class="space-y-1.5">
          <label for="admin-password" class="text-xs font-bold text-canvas/80 block">Mật Khẩu</label>
          <input
            type="password"
            id="admin-password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-2xl bg-black/30 border border-white/15 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-terracotta transition-colors"
          />
        </div>

        <button
          type="submit"
          id="login-submit-btn"
          class="w-full py-3.5 rounded-full bg-warm-gradient hover:brightness-110 text-white font-bold text-sm transition-all shadow-glow active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer mt-2"
        >
          <span id="btn-text">Đăng Nhập Vào Dashboard →</span>
          <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>
        </button>
      </form>

      <div class="p-3.5 rounded-2xl bg-white/5 border border-white/5 text-[11px] text-canvas/50 leading-relaxed font-medium text-center">
        🔒 Tài khoản được bảo vệ bởi Firebase Authentication.
      </div>

    </div>
  </main>

  <!-- Footer nhỏ gọn -->
  <footer class="py-6 text-center text-xs text-canvas/40 border-t border-white/5">
    © 2026 Guitar By Quang • Khu vực quản trị riêng tư
  </footer>

  <!-- Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="firebase-auth-service.js"></script>
  <script type="module" src="admin-login.js"></script>
</body>
</html>
